[TARGET]
name = Mikrotik
url = http://mp.wifi
login_path = /login
gateway_ip = (ip ထည့်ပါ)
gateway_port = 80
gateway_scheme = http

[SETTINGS]
code_length = 6
charset = 0123456789
random_order = true
max_workers = 50
batch_submit = 100
random_headers = true
random_dst = true
timeout = 10
retry_count = 2

[HISTORY]
file = history.txt
success = success.txt

[OUTPUT]
show_failed = true
show_limited = flase
show_progress = true
